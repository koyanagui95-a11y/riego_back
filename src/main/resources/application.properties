spring.application.name=sistema-riego-inteligente

# Base de datos (Supabase / PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Servidor
server.port=${PORT:8080}

# Mail (Mailtrap)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_USERNAME}
spring.mail.password=${MAILTRAP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# App
app.frontend.url=${FRONTEND_URL}
app.reset.token.minutos=30
app.mail.from=${MAIL_FROM:noreply@riego.local}

# JWT (reemplaza ADMIN_KEY)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000


# Brevo API (para credenciales de clientes)
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME:Riego Inteligente}

app.vapid.public.key=${VAPID_PUBLIC_KEY}
app.vapid.private.key=${VAPID_PRIVATE_KEY}
app.vapid.subject=mailto:admin@riego.com